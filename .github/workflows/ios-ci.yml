name: iOS build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: HealthCore unit tests (SwiftPM)
        run: swift test --package-path Packages/HealthCore

      - name: Build & test app (iOS Simulator, no signing)
        run: |
          set -o pipefail
          NAME=$(python3 -c 'import json;print(json.load(open("project.config.json"))["projectName"])')
          xcodebuild \
            -project "${NAME}.xcodeproj" \
            -scheme "${NAME}" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults.xcresult \
            clean build test 2>&1 | tee xcodebuild.log

      - name: Upload build log & test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            TestResults.xcresult
          retention-days: 14
